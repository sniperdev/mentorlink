name: Auth CI

on:
  push:
    branches:
      - main
    paths:
      - 'services/auth-service/**'
      - '.forgejo/workflows/auth.yml'
  pull_request:
    paths:
      - 'services/auth-service/**'
      - '.forgejo/workflows/auth.yml'
  workflow_dispatch:

jobs:
  auth:
    name: Auth Tests and Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        working-directory: services/auth-service
        run: ./mvnw -B test

      - name: Set up Docker CLI
        run: |
          apt-get update
          apt-get install -y docker.io

      - name: Login to Forgejo Container Registry
        env:
          DOCKER_HOST: tcp://docker-in-docker:2375
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login forgejo.home.sniperlab.uk \
            -u "${{ github.repository_owner }}" \
            --password-stdin

      - name: Build and push Docker image
        env:
          DOCKER_HOST: tcp://docker-in-docker:2375
        run: |
          IMAGE="forgejo.home.sniperlab.uk/sniperdev/mentorlink-auth"

          docker build \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            ./services/auth-service

          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Trigger Coolify deploy
        if: github.event_name != 'pull_request'
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_URL: ${{ secrets.COOLIFY_WEBHOOK_URL_AUTH }}
        run: |
          curl --fail-with-body -sS \
            --request POST \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_URL"