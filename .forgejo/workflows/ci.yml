name: MentorLink CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test MentorLink Backend
        working-directory: services/mentorlink-backend
        run: ./mvnw -B test

  auth-tests:
    name: Auth Service Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test Auth Service
        working-directory: services/auth-service
        run: ./mvnw -B test

  frontend:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Docker CLI
        run: |
          apt-get update
          apt-get install -y --no-install-recommends docker.io

      - name: Check Docker daemon
        run: docker version

      - name: Test Docker build
        run: |
          docker build \
            -t mentorlink-frontend:test \
            ./apps/mentorlink-frontend

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.18.0 --activate

      - name: Install dependencies
        working-directory: apps/mentorlink-frontend
        run: pnpm install --frozen-lockfile

      - name: ESLint
        working-directory: apps/mentorlink-frontend
        run: pnpm lint

      - name: Next.js Build
        working-directory: apps/mentorlink-frontend
        run: pnpm build