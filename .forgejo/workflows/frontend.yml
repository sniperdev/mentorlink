name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - 'apps/mentorlink-frontend/**'
      - '.forgejo/workflows/frontend.yml'
  pull_request:
    paths:
      - 'apps/mentorlink-frontend/**'
      - '.forgejo/workflows/frontend.yml'
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend Lint, Build and Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.18.0 --activate

      - name: Install dependencies
        working-directory: apps/mentorlink-frontend
        run: pnpm install --frozen-lockfile

      - name: ESLint
        working-directory: apps/mentorlink-frontend
        run: pnpm lint

      - name: Next.js Build
        working-directory: apps/mentorlink-frontend
        run: pnpm build

      - name: Set up Docker CLI
        run: |
          apt-get update
          apt-get install -y docker.io

      - name: Login to Forgejo Container Registry
        env:
          DOCKER_HOST: tcp://docker-in-docker:2375
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login forgejo.home.sniperlab.uk \
            -u "${{ github.repository_owner }}" \
            --password-stdin

      - name: Build and push Docker image
        env:
          DOCKER_HOST: tcp://docker-in-docker:2375
        run: |
          IMAGE="forgejo.home.sniperlab.uk/sniperdev/mentorlink-frontend"

          docker build \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            --build-arg NEXT_PUBLIC_API_URL=/api/v1 \
            ./apps/mentorlink-frontend

          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Trigger Coolify deploy
        if: github.event_name != 'pull_request'
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_URL: ${{ secrets.COOLIFY_WEBHOOK_URL_FRONTEND }}
        run: |
          curl --fail -sS \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_URL"