name: Runner Smoke Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  runner-test:
    runs-on: ubuntu-latest

    steps:
      - name: Display runner information
        run: |
          echo "Forgejo Actions runner is working!"
          echo "Hostname:"
          hostname
          echo "System:"
          uname -a

      - name: Check Node.js
        run: |
          node --version
          npm --version

      - name: Check environment
        run: |
          echo "User: $(whoami)"
          echo "Working directory: $(pwd)"
          echo "Date: $(date -u)"
