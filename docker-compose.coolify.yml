services:
  postgres:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_USER: mentorlink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: postgres

    volumes:
      - mentorlink_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - mentorlink

  mentorlink-backend:
    build:
      context: ./services/mentorlink-backend
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: mentorlink
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "${BACKEND_PORT:-18081}:8080"

    networks:
      - mentorlink

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: mentorlink
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION:-900000}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION:-604800000}

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "${AUTH_PORT:-18082}:8081"

    networks:
      - mentorlink

  frontend:
    build:
      context: ./apps/mentorlink-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${FRONTEND_API_URL:-http://localhost:18081/api/v1}

    restart: unless-stopped

    depends_on:
      - mentorlink-backend
      - auth-service

    ports:
      - "${FRONTEND_PORT:-18080}:3000"

    networks:
      - mentorlink

volumes:
  mentorlink_postgres_data:

networks:
  mentorlink:
    driver: bridge
