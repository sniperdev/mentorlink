services:
  postgres:
    image: postgres:17
    container_name: mentorlink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mentorlink
      POSTGRES_USER: mentorlink
      POSTGRES_PASSWORD: mentorlink
    ports:
      - "5432:5432"
    volumes:
      - mentorlink_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mentorlink_postgres_data: