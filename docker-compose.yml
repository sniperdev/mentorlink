services:
  postgres:
    image: postgres:17
    container_name: mentorlink-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: mentorlink
      POSTGRES_PASSWORD: mentorlink
      POSTGRES_DB: postgres

    ports:
      - "5432:5432"

    volumes:
      - mentorlink_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mentorlink_postgres_data: