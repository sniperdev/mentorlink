server:
  port: 8081

spring:
  application:
    name: mentorlink-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/auth_db}
    username: ${DB_USERNAME:mentorlink}
    password: ${DB_PASSWORD:mentorlink}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        show_sql: false

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.sql: INFO
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
